services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=isitjustme'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=isitjustme'
    ports:
      - '5432:5432'
  redis:
    image: 'redis:8'
    ports:
      - '6379:6379'
  kafka:
    image: 'apache/kafka-native:latest'
    ports:
      - '9092:9092'
