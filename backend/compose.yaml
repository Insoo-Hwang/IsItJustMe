services:
  postgres:
    image: 'postgres:18'
    command: ['postgres', '-c', 'timezone=Asia/Seoul']
    environment:
      - 'POSTGRES_DB=isitjustme'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=isitjustme'
    ports:
      # this machine only: the dev password is not a secret
      - '127.0.0.1:5432:5432'
  redis:
    image: 'redis:8'
    ports:
      - '127.0.0.1:6379:6379'
