spring.application.name=isitjustme

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info

# Redis is only a cache: give up quickly and read the database when it is down.
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# How often every complete guest is scored again for the "top n%" rank.
overall.ranks.initial-delay=PT0S
overall.ranks.refresh=PT5M

# STORY.md is the source of the category and question texts. When this file exists
# (local runs from backend/), saves are applied while running; otherwise the copy
# packaged into the jar is read once on startup.
story.file=../STORY.md

# Token for the admin page (/backstage). Set ADMIN_TOKEN (or put it in backend/.env, which git
# ignores); when it is empty a random token is
# made on startup and written to the log.
spring.config.import=optional:file:.env[.properties]
admin.token=${ADMIN_TOKEN:}

# Closes the visitor APIs with a 503 and a message while true. The admin page can switch
# it while running; a restart goes back to this value.
site.maintenance=${MAINTENANCE:false}
