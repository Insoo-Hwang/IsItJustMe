spring.application.name=isitjustme

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info

# Redis is only a cache: give up quickly and read the database when it is down.
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# STORY.md is the source of the category and question texts. When this file exists
# (local runs from backend/), saves are applied while running; otherwise the copy
# packaged into the jar is read once on startup.
story.file=../STORY.md
