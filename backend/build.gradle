plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.isitjustme'
version = '0.0.1-SNAPSHOT'
description = 'IsItJustMe backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-kafka'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// Frontend (../frontend) build -> packaged into bootJar as classpath:/static
//   ./gradlew bootJar                  : npm ci + npm run build + jar
//   ./gradlew bootJar -PskipFrontend   : backend only
// ---------------------------------------------------------------------------
def frontendDir = layout.projectDirectory.dir('../frontend')
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def npm = { List<String> args -> (isWindows ? ['cmd', '/c', 'npm'] : ['npm']) + args }

def npmInstall = tasks.register('npmInstall', Exec) {
	group = 'frontend'
	description = 'Installs frontend dependencies (npm ci).'
	workingDir = frontendDir
	commandLine npm(['ci'])
	inputs.files(frontendDir.file('package.json'), frontendDir.file('package-lock.json'))
	outputs.file(frontendDir.file('node_modules/.package-lock.json'))
}

def npmBuild = tasks.register('npmBuild', Exec) {
	group = 'frontend'
	description = 'Builds the frontend (npm run build) into ../frontend/dist.'
	dependsOn npmInstall
	workingDir = frontendDir
	commandLine npm(['run', 'build'])
	inputs.dir(frontendDir.dir('src'))
	inputs.dir(frontendDir.dir('public'))
	inputs.files(fileTree(frontendDir) {
		include 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig*.json'
	})
	outputs.dir(frontendDir.dir('dist'))
}

tasks.named('bootJar') {
	archiveBaseName = 'isitjustme'
	if (!project.hasProperty('skipFrontend')) {
		from(npmBuild) {
			into 'BOOT-INF/classes/static'
		}
	}
}

tasks.named('clean') {
	delete frontendDir.dir('dist')
}
